<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="formBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="folderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1280" height="720" fill="url(#formBg)"/>

  <!-- Legal File Folder in Background -->
  <g transform="translate(680, 100) rotate(-4)">
    <path d="M 0 40 L 140 40 L 180 80 L 460 80 L 460 480 L 0 480 Z" fill="url(#folderAmber)" rx="14" filter="drop-shadow(0 12px 28px rgba(0,0,0,0.1))"/>
  </g>

  <!-- Underneath Stack of Application Papers -->
  <rect x="740" y="150" width="360" height="480" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" transform="rotate(2 920 390)"/>

  <!-- Main Ready-to-Use Formal Application Sheet in Foreground -->
  <rect x="770" y="120" width="370" height="510" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 16px 36px rgba(15,23,42,0.12))"/>

  <!-- Top Document Header: सेवा में / श्रीमान... -->
  <line x1="810" y1="160" x2="920" y2="160" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <line x1="810" y1="180" x2="980" y2="180" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="810" y1="198" x2="940" y2="198" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Subject / विषय Line -->
  <rect x="810" y="225" width="290" height="28" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <line x1="825" y1="239" x2="1000" y2="239" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Application Body Paragraphs -->
  <line x1="810" y1="275" x2="1100" y2="275" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="810" y1="295" x2="1080" y2="295" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="810" y1="315" x2="1090" y2="315" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="810" y1="335" x2="1030" y2="335" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <line x1="810" y1="370" x2="1100" y2="370" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="810" y1="390" x2="1070" y2="390" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="810" y1="410" x2="960" y2="410" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Signature Line & Prarthi -->
  <line x1="970" y1="465" x2="1080" y2="465" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="990" y1="485" x2="1060" y2="485" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Official Receiving Stamp Placeholder on Left -->
  <g transform="translate(820, 480)">
    <rect x="0" y="0" width="110" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="55" cy="35" r="16" fill="#16a34a" opacity="0.15"/>
    <path d="M 48 35 L 53 40 L 62 31" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="90" y2="65" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="75" x2="80" y2="75" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Classic Fountain Pen Across the Paper -->
  <g transform="translate(1120, 240) rotate(45)">
    <!-- Pen Barrel -->
    <rect x="0" y="0" width="22" height="240" rx="11" fill="url(#penBody)" filter="drop-shadow(6px 12px 18px rgba(0,0,0,0.15))"/>
    <!-- Gold Trim Bands -->
    <rect x="0" y="40" width="22" height="6" fill="#fbbf24"/>
    <rect x="0" y="120" width="22" height="8" fill="#fbbf24"/>
    <rect x="0" y="210" width="22" height="4" fill="#fbbf24"/>
    <!-- Nib -->
    <polygon points="4,240 18,240 11,280" fill="#fbbf24"/>
    <polygon points="8,265 14,265 11,280" fill="#0f172a"/>
  </g>

  <!-- Modern Paperclip on Top Corner -->
  <path d="M 800 135 L 800 95 C 800 80 825 80 825 95 L 825 155 C 825 175 790 175 790 155 L 790 105" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
</svg>
