<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bookCover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bookCover2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#artBg)"/>

  <!-- Library Window & Outside Trees -->
  <rect x="740" y="60" width="460" height="420" rx="20" fill="#bae6fd" opacity="0.6"/>
  <circle cx="1060" cy="180" r="140" fill="#86efac" opacity="0.5"/>
  <circle cx="860" cy="220" r="110" fill="#4ade80" opacity="0.4"/>
  <circle cx="1180" cy="260" r="130" fill="#22c55e" opacity="0.3"/>

  <!-- Window Frame Panes -->
  <rect x="740" y="60" width="460" height="420" rx="20" fill="none" stroke="#ffffff" stroke-width="12"/>
  <line x1="970" y1="60" x2="970" y2="480" stroke="#ffffff" stroke-width="10"/>
  <line x1="740" y1="270" x2="1200" y2="270" stroke="#ffffff" stroke-width="10"/>

  <!-- Sunbeams streaming in -->
  <polygon points="760,60 1200,60 1280,680 620,680" fill="url(#sunbeam)"/>

  <!-- Study Desk Surface -->
  <path d="M 520 440 L 1280 440 L 1280 720 L 520 720 Z" fill="url(#deskGrad)"/>
  <line x1="520" y1="440" x2="1280" y2="440" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Bookshelves in Background -->
  <rect x="560" y="100" width="140" height="340" rx="8" fill="#e2e8f0" opacity="0.7"/>
  <rect x="575" y="130" width="18" height="90" rx="4" fill="#3b82f6" opacity="0.8"/>
  <rect x="597" y="120" width="22" height="100" rx="4" fill="#f59e0b" opacity="0.8"/>
  <rect x="623" y="140" width="16" height="80" rx="4" fill="#10b981" opacity="0.8"/>
  <rect x="643" y="125" width="20" height="95" rx="4" fill="#8b5cf6" opacity="0.8"/>

  <!-- Open Study Guidebook on Desk -->
  <path d="M 760 520 C 820 500 870 505 910 525 L 910 650 C 870 630 820 625 760 645 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 1060 520 C 1000 500 950 505 910 525 L 910 650 C 950 630 1000 625 1060 645 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="910" y1="525" x2="910" y2="650" stroke="#94a3b8" stroke-width="3"/>
  
  <!-- Text lines on open book -->
  <line x1="785" y1="535" x2="885" y2="535" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="785" y1="555" x2="875" y2="555" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="785" y1="575" x2="890" y2="575" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="785" y1="595" x2="865" y2="595" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <line x1="935" y1="535" x2="1035" y2="535" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="935" y1="555" x2="1025" y2="555" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="935" y1="575" x2="1040" y2="575" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="935" y1="595" x2="1015" y2="595" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Stack of Books with Bookmarks -->
  <rect x="620" y="580" width="110" height="24" rx="4" fill="url(#bookCover1)"/>
  <rect x="625" y="556" width="100" height="24" rx="4" fill="url(#bookCover2)"/>
  <rect x="635" y="534" width="90" height="22" rx="4" fill="#f59e0b"/>
  <polygon points="705,534 715,534 715,550 710,544 705,550" fill="#ef4444"/>

  <!-- Glasses & Pen on Desk -->
  <ellipse cx="1120" cy="560" rx="18" ry="12" fill="none" stroke="#64748b" stroke-width="3"/>
  <ellipse cx="1165" cy="560" rx="18" ry="12" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 1138 560 Q 1151 554 1147 560" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="1102" y1="560" x2="1085" y2="575" stroke="#64748b" stroke-width="3"/>
  <line x1="1183" y1="560" x2="1200" y2="575" stroke="#64748b" stroke-width="3"/>

  <!-- Stylized Study Lamp -->
  <path d="M 1210 320 C 1200 370 1190 440 1210 520" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M 1180 320 L 1240 320 L 1260 360 L 1160 360 Z" fill="#0284c7"/>
  <ellipse cx="1210" cy="360" rx="50" ry="12" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="1210" cy="520" rx="35" ry="10" fill="#334155"/>

  <!-- Abstract Badge / Knowledge Shield Icon -->
  <circle cx="1060" cy="140" r="38" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.08))"/>
  <path d="M 1060 120 L 1082 130 L 1082 145 C 1082 160 1060 168 1060 168 C 1060 168 1038 160 1038 145 L 1038 130 Z" fill="#0284c7"/>
  <path d="M 1052 143 L 1058 149 L 1070 137" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
