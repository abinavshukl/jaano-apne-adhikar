<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="legalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="policyShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1280" height="720" fill="url(#legalBg)"/>

  <!-- Public Educational Charter Scroll in Center-Right -->
  <rect x="760" y="100" width="440" height="520" rx="16" fill="url(#scrollGrad)" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 14px 32px rgba(15,23,42,0.1))"/>

  <!-- Scroll Header -->
  <rect x="790" y="130" width="80" height="8" rx="4" fill="#0284c7"/>
  <line x1="790" y1="160" x2="1060" y2="160" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="790" y1="180" x2="980" y2="180" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Section Divider -->
  <line x1="790" y1="210" x2="1170" y2="210" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Charter Bullet Points -->
  <!-- 1. जन-जागरूकता पहल -->
  <circle cx="805" cy="245" r="8" fill="#e0f2fe"/>
  <circle cx="805" cy="245" r="4" fill="#0284c7"/>
  <line x1="830" y1="245" x2="1140" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="830" y1="262" x2="1090" y2="262" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- 2. डेटा गोपनीयता (Zero Tracking) -->
  <circle cx="805" cy="305" r="8" fill="#dcfce7"/>
  <circle cx="805" cy="305" r="4" fill="#16a34a"/>
  <line x1="830" y1="305" x2="1120" y2="305" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="830" y1="322" x2="1050" y2="322" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- 3. विधिक अस्वीकरण (Independent Initiative) -->
  <circle cx="805" cy="365" r="8" fill="#fef3c7"/>
  <circle cx="805" cy="365" r="4" fill="#d97706"/>
  <line x1="830" y1="365" x2="1150" y2="365" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="830" y1="382" x2="1080" y2="382" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Privacy Security Seal in Foreground -->
  <g transform="translate(1040, 480)">
    <!-- Outer Shield -->
    <path d="M 0 -70 L 60 -40 C 60 40 0 80 0 80 C 0 80 -60 40 -60 -40 Z" fill="url(#policyShield)" filter="drop-shadow(0 10px 24px rgba(2,132,199,0.25))"/>
    <path d="M 0 -62 L 52 -36 C 52 32 0 68 0 68 C 0 68 -52 32 -52 -36 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <!-- Padlock inside -->
    <rect x="-18" y="-10" width="36" height="30" rx="6" fill="#ffffff"/>
    <path d="M -10 -10 L -10 -22 C -10 -30 10 -30 10 -22 L 10 -10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="4" fill="#0284c7"/>
  </g>
</svg>
