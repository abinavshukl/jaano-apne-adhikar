<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1280" height="720" fill="url(#cyberBg)"/>

  <!-- Ambient Shield Glow Background -->
  <circle cx="980" cy="360" r="280" fill="url(#shieldGlow)"/>

  <!-- Digital Network Protection Grid (Subtle) -->
  <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.6">
    <line x1="720" y1="140" x2="1240" y2="140"/>
    <line x1="720" y1="260" x2="1240" y2="260"/>
    <line x1="720" y1="380" x2="1240" y2="380"/>
    <line x1="720" y1="500" x2="1240" y2="500"/>
    <line x1="720" y1="620" x2="1240" y2="620"/>
    <line x1="820" y1="80" x2="820" y2="660"/>
    <line x1="960" y1="80" x2="960" y2="660"/>
    <line x1="1100" y1="80" x2="1100" y2="660"/>
  </g>

  <!-- Smartphone in Center -->
  <rect x="880" y="160" width="220" height="420" rx="36" fill="url(#phoneBody)" filter="drop-shadow(0 16px 32px rgba(15,23,42,0.18))"/>
  <!-- Phone Screen -->
  <rect x="892" y="174" width="196" height="392" rx="26" fill="#ffffff"/>
  <!-- Top notch -->
  <rect x="955" y="180" width="70" height="14" rx="7" fill="#1e293b"/>

  <!-- Safe Banking UI on Screen -->
  <rect x="910" y="220" width="160" height="70" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <circle cx="935" cy="255" r="14" fill="#16a34a"/>
  <path d="M 929 255 L 933 259 L 941 251" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="960" y1="248" x2="1040" y2="248" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
  <line x1="960" y1="262" x2="1020" y2="262" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>

  <!-- Incoming Scam Message Deflected -->
  <g opacity="0.6">
    <rect x="680" y="240" width="160" height="60" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <line x1="700" y1="260" x2="810" y2="260" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="700" y1="275" x2="770" y2="275" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <!-- Red alert crossed out -->
    <circle cx="820" cy="270" r="10" fill="#dc2626"/>
    <line x1="814" y1="264" x2="826" y2="276" stroke="#ffffff" stroke-width="2"/>
    <line x1="826" y1="264" x2="814" y2="276" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Deflection Arc Rays -->
  <path d="M 830 200 Q 860 360 830 520" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Large Glowing Security Cyber Shield in Foreground -->
  <g transform="translate(990, 390)">
    <!-- Outer Shield Halo -->
    <path d="M 0 -130 L 95 -80 C 95 60 0 130 0 130 C 0 130 -95 60 -95 -80 Z" fill="url(#shieldGrad)" filter="drop-shadow(0 12px 28px rgba(2,132,199,0.35))"/>
    <path d="M 0 -120 L 85 -75 C 85 50 0 115 0 115 C 0 115 -85 50 -85 -75 Z" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.8"/>

    <!-- Biometric Padlock Icon Inside Shield -->
    <rect x="-32" y="-20" width="64" height="55" rx="12" fill="#ffffff"/>
    <path d="M -18 -20 L -18 -42 C -18 -55 18 -55 18 -42 L 18 -20" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="7" fill="#0284c7"/>
    <rect x="-3" y="5" width="6" height="14" fill="#0284c7"/>
  </g>

  <!-- 1930 Cyber Helpline Badge -->
  <g transform="translate(1100, 210)">
    <rect x="0" y="0" width="130" height="48" rx="24" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
    <circle cx="24" cy="24" r="14" fill="#0284c7"/>
    <!-- Phone icon -->
    <path d="M 19 21 C 19 26 23 29 27 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="20" x2="110" y2="20" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <line x1="48" y1="30" x2="95" y2="30" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
