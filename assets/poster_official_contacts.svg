<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="folderBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Room Canvas -->
  <rect width="1280" height="720" fill="url(#officeBg)"/>

  <!-- Wall Notice Board / Panchayat Directory -->
  <rect x="740" y="80" width="460" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.05))"/>
  <rect x="760" y="100" width="420" height="36" rx="6" fill="#0f766e"/>
  <!-- Notice board header simulation -->
  <line x1="820" y1="118" x2="1040" y2="118" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="1060" y1="118" x2="1120" y2="118" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>

  <!-- Directory Cards on Board -->
  <!-- Lekhpal Card -->
  <rect x="765" y="155" width="125" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="827" cy="190" r="20" fill="#fed7aa"/>
  <line x1="785" y1="225" x2="870" y2="225" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="795" y1="242" x2="860" y2="242" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="785" y="260" width="85" height="20" rx="4" fill="#0d9488"/>
  <line x1="795" y1="270" x2="855" y2="270" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Gram Sachiv Card -->
  <rect x="905" y="155" width="125" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="967" cy="190" r="20" fill="#bbf7d0"/>
  <line x1="925" y1="225" x2="1010" y2="225" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="935" y1="242" x2="1000" y2="242" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="925" y="260" width="85" height="20" rx="4" fill="#16a34a"/>
  <line x1="935" y1="270" x2="995" y2="270" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- BDO / SDM Card -->
  <rect x="1045" y="155" width="135" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="1112" cy="190" r="20" fill="#bfdbfe"/>
  <line x1="1065" y1="225" x2="1160" y2="225" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="1075" y1="242" x2="1150" y2="242" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="1065" y="260" width="95" height="20" rx="4" fill="#2563eb"/>
  <line x1="1075" y1="270" x2="1145" y2="270" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Consultation Desk in Foreground -->
  <path d="M 520 440 L 1280 440 L 1280 720 L 520 720 Z" fill="url(#deskWood)"/>
  <line x1="520" y1="440" x2="1280" y2="440" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Desktop Monitor / Digital Portal -->
  <rect x="680" y="320" width="180" height="120" rx="10" fill="#1e293b"/>
  <rect x="690" y="330" width="160" height="100" rx="6" fill="#0284c7" opacity="0.8"/>
  <!-- Screen interface details -->
  <rect x="700" y="340" width="60" height="14" rx="3" fill="#ffffff"/>
  <line x1="700" y1="365" x2="780" y2="365" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="375" x2="760" y2="375" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="760" y="440" width="20" height="40" fill="#64748b"/>
  <ellipse cx="770" cy="480" rx="35" ry="8" fill="#475569"/>

  <!-- Office Telephone / Helpline Receiver -->
  <g transform="translate(930, 480)">
    <rect x="0" y="0" width="90" height="75" rx="12" fill="#334155"/>
    <circle cx="30" cy="35" r="16" fill="#1e293b"/>
    <circle cx="30" cy="35" r="8" fill="#475569"/>
    <!-- Dial buttons -->
    <circle cx="65" cy="20" r="4" fill="#94a3b8"/>
    <circle cx="75" cy="20" r="4" fill="#94a3b8"/>
    <circle cx="65" cy="32" r="4" fill="#94a3b8"/>
    <circle cx="75" cy="32" r="4" fill="#94a3b8"/>
    <circle cx="65" cy="44" r="4" fill="#94a3b8"/>
    <circle cx="75" cy="44" r="4" fill="#94a3b8"/>
    <!-- Handset -->
    <path d="M -10 15 C 20 -15 70 -15 100 15" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Official Register & Files with Receiving Stamp -->
  <rect x="1070" y="490" width="160" height="110" rx="6" fill="url(#folderBlue)" transform="rotate(-6 1070 490)"/>
  <rect x="1080" y="495" width="145" height="95" rx="4" fill="#ffffff" transform="rotate(-6 1070 490)"/>
  <circle cx="1180" cy="540" r="22" fill="#10b981" opacity="0.15"/>
  <circle cx="1180" cy="540" r="20" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 1172 540 L 1178 546 L 1190 534" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
